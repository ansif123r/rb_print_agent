name: Build Windows Installer

on:
  push:
    branches:
      - main
      - fix/pos-printer-routing
      - fix/windowed-print-agent-startup
      - milestone-2-desktop-installer
      - milestone-1-foundation
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Test printer routing
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "RB Print Agent" `
            --hidden-import=win32print `
            --hidden-import=win32crypt `
            --hidden-import=win32event `
            --hidden-import=win32api `
            --hidden-import=uvicorn.loops.asyncio `
            --hidden-import=uvicorn.protocols.http.h11_impl `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=win32gui `
            --hidden-import=win32ui `
            --hidden-import=PIL.ImageWin `
            --collect-all pymupdf `
            --collect-all pystray `
            --collect-all PIL `
            desktop_app.py

      - name: Verify windowed executable starts the POS bridge
        shell: powershell
        run: |
          $result = Join-Path $PWD "startup-result.json"
          $agent = Start-Process -FilePath "dist\RB Print Agent.exe" -ArgumentList "--self-test", "`"$result`"" -PassThru
          if (-not $agent.WaitForExit(60000)) {
            Stop-Process -Id $agent.Id -Force
            throw "Windowed agent startup test timed out."
          }
          if (-not (Test-Path $result)) { throw "Windowed agent did not produce its startup result." }
          $check = Get-Content -Raw $result | ConvertFrom-Json
          if (-not $check.ok) { throw $check.error }
          Write-Host "Windowed POS bridge started: $($check.health | ConvertTo-Json -Compress)"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Generate installer icon
        shell: powershell
        run: |
          $iconData = [Convert]::FromBase64String((Get-Content -Raw installer\rb_fresh_mart.ico.b64).Trim())
          [IO.File]::WriteAllBytes("rb_fresh_mart.ico", $iconData)
          if (-not (Test-Path "rb_fresh_mart.ico")) { throw "Installer icon was not created." }

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\RBPrintAgent.iss

      - name: Verify installer
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path installer-output -Filter "RB-Print-Agent-Setup-*.exe" -File
          if (-not $installer) { throw "Installer EXE was not created." }
          Write-Host "Installer created: $($installer.FullName)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RB-Print-Agent-Windows-Installer
          path: installer-output\RB-Print-Agent-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: RB-Print-Agent-Windows-Portable
          path: dist\RB Print Agent.exe
          if-no-files-found: error

